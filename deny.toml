[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "Informational advisory: crate is unmaintained. As a feature-complete proc-macro with narrow scope, it carries no runtime risk, and any future issue would surface at build time." },
    { id = "RUSTSEC-2026-0543", reason = "Informational advisory: chrono is unmaintained, with no maintained alternative available yet." },
]

[bans]
wildcards = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
